services:
  metadata-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-database_service}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/metadata_postgres_password
    volumes:
      - ${METADATA_DATA_PATH:-./data/metadata}:/var/lib/postgresql/data
      - ${SECRETS_PATH:-./secrets}/metadata_postgres_password:/run/secrets/metadata_postgres_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-database_service}"]
      interval: 10s
      timeout: 5s
      retries: 10

  database-service-api:
    image: ${IMAGE_REF}
    restart: unless-stopped
    depends_on:
      metadata-postgres:
        condition: service_healthy
    environment:
      API_PORT: "8080"
      DATABASE_URL_FILE: /run/secrets/database_url
      TARGET_ADMIN_DATABASE_URL_FILE: /run/secrets/target_admin_database_url
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      RUST_LOG: ${RUST_LOG:-database_service_api=info,database_service_store=info}
    volumes:
      - ${SECRETS_PATH:-./secrets}/database_url:/run/secrets/database_url:ro
      - ${SECRETS_PATH:-./secrets}/target_admin_database_url:/run/secrets/target_admin_database_url:ro
    ports:
      - "${API_PORT_HOST:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
