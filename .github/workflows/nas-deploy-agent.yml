name: nas-deploy-agent

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and deploy
        required: false
        default: main
      environment_name:
        description: GitHub environment to deploy through
        required: false
        default: nas-prod
      deploy:
        description: Deploy after image publish
        required: true
        default: "true"

permissions:
  contents: read
  packages: write

env:
  DEFAULT_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/database-service

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Ensure Dockerfile exists
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="${DEFAULT_IMAGE_NAME}"
          IMAGE_REF="${IMAGE_NAME}:${GITHUB_SHA}"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.image_ref }}
            ${{ env.DEFAULT_IMAGE_NAME }}:main

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.deploy == 'true' }}
    environment: ${{ inputs.environment_name }}
    steps:
      - name: Configure SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.NAS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.NAS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to NAS over SSH
        shell: bash
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_SSH_USER: ${{ secrets.NAS_SSH_USER }}
          NAS_DEPLOY_PATH: ${{ secrets.NAS_DEPLOY_PATH }}
          GHCR_DEPLOY_USERNAME: ${{ secrets.GHCR_DEPLOY_USERNAME }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          NAS_COMPOSE_FILE: ${{ vars.NAS_COMPOSE_FILE }}
        run: |
          set -euo pipefail
          COMPOSE_FILE="${NAS_COMPOSE_FILE:-compose.prod.yaml}"
          cat > .gha-deploy.env <<EOF
          IMAGE_REF=${IMAGE_REF}
          GHCR_DEPLOY_USERNAME=${GHCR_DEPLOY_USERNAME}
          GHCR_DEPLOY_TOKEN=${GHCR_DEPLOY_TOKEN}
          EOF
          scp .gha-deploy.env "${NAS_SSH_USER}@${NAS_HOST}:${NAS_DEPLOY_PATH}/.gha-deploy.env"
          ssh "${NAS_SSH_USER}@${NAS_HOST}" \
            "set -euo pipefail; \
             cd '${NAS_DEPLOY_PATH}'; \
             . ./.gha-deploy.env; \
             echo \"\$GHCR_DEPLOY_TOKEN\" | docker login ghcr.io -u \"\$GHCR_DEPLOY_USERNAME\" --password-stdin; \
             docker compose --env-file .gha-deploy.env -f '${COMPOSE_FILE}' pull; \
             docker compose --env-file .gha-deploy.env -f '${COMPOSE_FILE}' up -d --remove-orphans; \
             docker image prune -f"

      - name: Write summary
        shell: bash
        run: |
          {
            echo "## NAS Deploy Agent"
            echo ""
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- Image: \`${{ needs.build.outputs.image_ref }}\`"
            echo "- Environment: \`${{ inputs.environment_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
